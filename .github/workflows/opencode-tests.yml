name: OpenCode contract tests

on:
  push:
    branches: [feature/opencode-tool-calling]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run contract tests
        run: python -m pytest tests/test_opencode.py tests/test_browser_channel.py -q
